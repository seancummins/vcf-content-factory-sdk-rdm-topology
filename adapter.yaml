name: "VCF Content Factory RDM Topology POC"
version: "0.1.0"
build_number: 13
adapter_kind: "vcfcf_rdm_topology_poc"
tier: 2
description: >
  Fixture-driven proof of the VCF Operations Java SDK mechanics for an additive
  relationship from an existing VMWARE VirtualMachine to a pack-owned
  RdmMapping resource. Optional version-2 fixtures add a qualified CanonicalLun
  and additive local mapping-to-LUN edge. An explicitly selected, one-shot
  read-only diagnostic uses native Java APIs without publishing topology.
  Fixture mode remains the default; no automatic production collector.
entry_class: "com.vcfcf.adapters.rdmtopologypoc.RdmTopologyDispatcher"
released: false
cross_mp_edges:
  - parent: "VMWARE VirtualMachine"
    child: "RdmMapping"
    direction: parent_foreign
    foreign_adapter_kind: "VMWARE"
    description: >
      Fixture-only additive relationship. The foreign VM ResourceKey preserves
      the Suite API-derived identifier names, values, and uniqueness flags;
      the POC does not create or modify VMWARE resources.
